name: Terraform Build and Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      # =====================================================
      # 1. CHECKOUT CODE
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. GITHUB OIDC -> AWS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::250368537874:role/oidc
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 3. CHECK AWS
      # =====================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # =====================================================
      # 4. SETUP TERRAFORM
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # =====================================================
      # 5. TERRAFORM FORMAT
      # =====================================================

      - name: Terraform Format
        run: |
          terraform fmt -check


      # =====================================================
      # 6. TERRAFORM INIT
      # =====================================================

      - name: Terraform Init
        run: |
          terraform init


      # =====================================================
      # 7. TERRAFORM VALIDATE
      # =====================================================

      - name: Terraform Validate
        run: |
          terraform validate


      # =====================================================
      # 8. TERRAFORM PLAN
      # =====================================================
      #
      # Existing AWS EC2 key pair name:
      #
      # aps
      #
      # NOT aps.pem
      #
      # =====================================================

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="key_name=aps" \
            -var="instance_type=t3.micro"


      # =====================================================
      # 9. TERRAFORM APPLY
      # =====================================================

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="key_name=aps" \
            -var="instance_type=t3.micro"


      # =====================================================
      # 10. GET TERRAFORM OUTPUTS
      # =====================================================

      - name: Get Terraform outputs
        id: terraform
        run: |

          echo "bastion_ip=$(terraform output -raw bastion_public_ip)" \
            >> "$GITHUB_OUTPUT"

          echo "bastion_dns=$(terraform output -raw bastion_public_dns)" \
            >> "$GITHUB_OUTPUT"

          echo "private_ip=$(terraform output -raw private_ec2_ip)" \
            >> "$GITHUB_OUTPUT"

          echo "alb_dns=$(terraform output -raw alb_dns_name)" \
            >> "$GITHUB_OUTPUT"

          echo "application_url=$(terraform output -raw application_url)" \
            >> "$GITHUB_OUTPUT"


      # =====================================================
      # 11. DISPLAY INFRASTRUCTURE
      # =====================================================

      - name: Display infrastructure
        run: |

          echo "=============================================="
          echo "Terraform Infrastructure"
          echo "=============================================="

          echo "Bastion Public IP:"
          echo "${{ steps.terraform.outputs.bastion_ip }}"

          echo ""

          echo "Bastion DNS:"
          echo "${{ steps.terraform.outputs.bastion_dns }}"

          echo ""

          echo "Private EC2 IP:"
          echo "${{ steps.terraform.outputs.private_ip }}"

          echo ""

          echo "ALB DNS:"
          echo "${{ steps.terraform.outputs.alb_dns }}"

          echo ""

          echo "Application URL:"
          echo "${{ steps.terraform.outputs.application_url }}"

          echo "=============================================="


      # =====================================================
      # 12. CONFIGURE SSH
      # =====================================================
      #
      # aps.pem is stored in:
      #
      # GitHub Secrets -> EC2_PRIVATE_KEY
      #
      # =====================================================

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_PRIVATE_KEY }}" \
            > ~/.ssh/aps.pem

          chmod 600 ~/.ssh/aps.pem

          cat > ~/.ssh/config <<EOF

          Host bastion

            HostName ${{ steps.terraform.outputs.bastion_ip }}

            User ec2-user

            IdentityFile ~/.ssh/aps.pem

            StrictHostKeyChecking no


          Host private-server

            HostName ${{ steps.terraform.outputs.private_ip }}

            User ec2-user

            IdentityFile ~/.ssh/aps.pem

            ProxyJump bastion

            StrictHostKeyChecking no

          EOF

          chmod 600 ~/.ssh/config


      # =====================================================
      # 13. TEST BASTION
      # =====================================================

      - name: Test Bastion connection
        run: |

          echo "Connecting to Bastion..."

          ssh bastion "hostname"


      # =====================================================
      # 14. TEST PRIVATE EC2 THROUGH BASTION
      # =====================================================

      - name: Test Private EC2 connection
        run: |

          echo "Connecting to Private EC2 through Bastion..."

          ssh private-server "hostname"


      # =====================================================
      # 15. INSTALL PYTHON 3 + PIP + NGINX
      # =====================================================

      - name: Install Python and Nginx
        run: |

          ssh private-server <<'EOF'

            set -e

            echo "===================================="
            echo "Installing packages"
            echo "===================================="


            # ------------------------------------------------
            # Amazon Linux
            # ------------------------------------------------

            if command -v dnf >/dev/null 2>&1; then

              echo "Amazon Linux detected"

              sudo dnf install -y \
                python3 \
                python3-pip \
                nginx


            # ------------------------------------------------
            # Older Amazon Linux / RHEL
            # ------------------------------------------------

            elif command -v yum >/dev/null 2>&1; then

              echo "YUM based OS detected"

              sudo yum install -y \
                python3 \
                python3-pip \
                nginx


            # ------------------------------------------------
            # Ubuntu / Debian
            # ------------------------------------------------

            elif command -v apt-get >/dev/null 2>&1; then

              echo "Ubuntu/Debian detected"

              sudo apt-get update -y

              sudo apt-get install -y \
                python3 \
                python3-pip \
                python3-venv \
                nginx

            else

              echo "Unsupported operating system"

              exit 1

            fi


            echo ""
            echo "Python version:"

            python3 --version


            echo ""
            echo "PIP version:"

            pip3 --version


            echo ""
            echo "Nginx version:"

            nginx -v

          EOF


      # =====================================================
      # 16. CREATE APPLICATION DIRECTORY
      # =====================================================

      - name: Create application directory
        run: |

          ssh private-server <<'EOF'

            set -e

            sudo mkdir -p /opt/multicloud-devops

            sudo chown -R \
              ec2-user:ec2-user \
              /opt/multicloud-devops

          EOF


      # =====================================================
      # 17. COPY APPLICATION
      # =====================================================

      - name: Copy Flask application
        run: |

          echo "Copying app.py..."

          scp app.py \
            private-server:/opt/multicloud-devops/app.py


          echo "Copying requirements.txt..."

          scp requirements.txt \
            private-server:/opt/multicloud-devops/requirements.txt


      # =====================================================
      # 18. CREATE PYTHON VIRTUAL ENVIRONMENT
      # =====================================================

      - name: Create Python virtual environment
        run: |

          ssh private-server <<'EOF'

            set -e

            cd /opt/multicloud-devops

            echo "Creating virtual environment..."

            python3 -m venv venv

            echo "Upgrading pip..."

            ./venv/bin/python \
              -m pip install --upgrade pip

          EOF


      # =====================================================
      # 19. INSTALL APPLICATION REQUIREMENTS
      # =====================================================

      - name: Install Python requirements
        run: |

          ssh private-server <<'EOF'

            set -e

            cd /opt/multicloud-devops

            echo "Installing Python dependencies..."

            ./venv/bin/pip \
              install -r requirements.txt

            echo ""
            echo "Installed packages:"

            ./venv/bin/pip list

          EOF


      # =====================================================
      # 20. CONFIGURE FLASK SERVICE
      # =====================================================

      - name: Configure Flask systemd service
        run: |

          ssh private-server <<'EOF'

            set -e

            sudo tee \
              /etc/systemd/system/multicloud-devops.service \
              > /dev/null <<'SERVICE'


            [Unit]
            Description=Multi Cloud DevOps Flask Application
            After=network.target


            [Service]

            User=ec2-user

            Group=ec2-user

            WorkingDirectory=/opt/multicloud-devops

            Environment="FLASK_ENV=production"

            Environment="FLASK_SECRET_KEY=change-this-secret-key"

            ExecStart=/opt/multicloud-devops/venv/bin/python /opt/multicloud-devops/app.py

            Restart=always

            RestartSec=5


            [Install]

            WantedBy=multi-user.target


            SERVICE


            sudo systemctl daemon-reload

            sudo systemctl enable multicloud-devops

            sudo systemctl restart multicloud-devops


            echo "Flask service started"

          EOF


      # =====================================================
      # 21. CONFIGURE NGINX
      # =====================================================
      #
      # ALB -> Private EC2 :80
      #
      # Nginx :80
      #      |
      #      v
      # Flask :5000
      #
      # =====================================================

      - name: Configure Nginx
        run: |

          ssh private-server <<'EOF'

            set -e

            sudo tee \
              /etc/nginx/conf.d/multicloud-devops.conf \
              > /dev/null <<'NGINX'


            server {

                listen 80;

                server_name _;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_http_version 1.1;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                }

            }


            NGINX


            # Remove default configuration if present

            if [ -f /etc/nginx/conf.d/default.conf ]; then

              sudo rm -f /etc/nginx/conf.d/default.conf

            fi


            echo "Testing Nginx configuration..."

            sudo nginx -t


            sudo systemctl enable nginx

            sudo systemctl restart nginx


            echo "Nginx started"

          EOF


      # =====================================================
      # 22. CHECK FLASK SERVICE
      # =====================================================

      - name: Check Flask service
        run: |

          ssh private-server <<'EOF'

            set -e

            echo "===================================="
            echo "Flask service status"
            echo "===================================="

            sudo systemctl status \
              multicloud-devops \
              --no-pager


            echo ""

            echo "Testing Flask locally..."

            curl -I \
              http://127.0.0.1:5000/

          EOF


      # =====================================================
      # 23. CHECK NGINX
      # =====================================================

      - name: Check Nginx
        run: |

          ssh private-server <<'EOF'

            set -e

            echo "===================================="
            echo "Nginx service status"
            echo "===================================="

            sudo systemctl status \
              nginx \
              --no-pager


            echo ""

            echo "Testing Nginx..."

            curl -I \
              http://127.0.0.1/

          EOF


      # =====================================================
      # 24. WAIT FOR ALB TARGET HEALTH
      # =====================================================

      - name: Wait for ALB
        run: |

          echo "Waiting for ALB target to become healthy..."

          sleep 30


      # =====================================================
      # 25. TEST APPLICATION THROUGH ALB
      # =====================================================

      - name: Test application through ALB
        run: |

          echo "=============================================="
          echo "Testing Application"
          echo "=============================================="

          curl -I \
            "${{ steps.terraform.outputs.application_url }}"


      # =====================================================
      # 26. FINAL OUTPUT
      # =====================================================

      - name: Deployment successful
        run: |

          echo ""
          echo "================================================"
          echo "        DEPLOYMENT SUCCESSFUL"
          echo "================================================"

          echo ""

          echo "Bastion:"
          echo "ssh ec2-user@${{ steps.terraform.outputs.bastion_ip }}"

          echo ""

          echo "Private EC2:"
          echo "${{ steps.terraform.outputs.private_ip }}"

          echo ""

          echo "ALB:"
          echo "${{ steps.terraform.outputs.alb_dns }}"

          echo ""

          echo "Application:"
          echo "${{ steps.terraform.outputs.application_url }}"

          echo ""

          echo "Architecture:"
          echo "GitHub -> Bastion -> Private EC2"

          echo "User -> ALB -> Nginx -> Flask"

          echo "================================================"